<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>连接失败 · 写作台</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #2B1B12;
    color: #F3EAD9;
    font-family: -apple-system, "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
  }
  .card {
    width: 100%; max-width: 420px; text-align: center;
  }
  .mark {
    width: 72px; height: 72px; margin: 0 auto 18px;
    border-radius: 20px; background: #3D2A1C;
    border: 1px solid rgba(243,234,217,.18);
    display: flex; align-items: center; justify-content: center;
    font-size: 38px; line-height: 1; color: #F3EAD9;
  }
  h1 { font-size: 19px; font-weight: 600; margin: 0 0 10px; letter-spacing: .5px; }
  p  { font-size: 14px; line-height: 1.7; color: #C9B8A4; margin: 0 0 6px; }
  .url {
    display: inline-block; margin: 12px 0 22px; padding: 7px 12px;
    font-size: 12px; color: #E4D6C3; background: rgba(243,234,217,.07);
    border: 1px solid rgba(243,234,217,.12); border-radius: 8px;
    word-break: break-all; font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  button {
    display: block; width: 100%; margin: 10px 0 0; padding: 14px 18px;
    font-size: 16px; font-family: inherit; border-radius: 12px;
    border: 1px solid rgba(243,234,217,.22); background: #F3EAD9; color: #2B1B12;
    font-weight: 600; letter-spacing: 1px;
  }
  button.ghost { background: transparent; color: #D9C9B4; border-color: rgba(243,234,217,.22); font-weight: 500; }
  button:active { opacity: .75; }
  .hint { margin-top: 18px; font-size: 12px; color: #8E7B67; line-height: 1.6; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">文</div>
    <h1>暂时连不上服务器</h1>
    <p>请确认网络可用，或检查服务器地址是否填写正确。</p>
    <div class="url" id="server">…</div>
    <button id="retry">重 试</button>
    <button class="ghost" id="settings">修改服务器地址</button>
    <div class="hint">提示：连不上时先确认手机网络，再点上面的「修改服务器地址」。</div>
  </div>
<script>
  var server = decodeURIComponent(location.hash.replace(/^#/, '')) || '';
  var el = document.getElementById('server');
  el.textContent = server;
  document.getElementById('retry').addEventListener('click', function () {
    if (window.Android && Android.retry) {
      Android.retry();
    } else {
      location.replace(server);
    }
  });
  document.getElementById('settings').addEventListener('click', function () {
    if (window.Android && Android.openSettings) Android.openSettings();
  });
</script>
</body>
</html>
